# Прокси к API поставщика АБСОЛЮТ. Запросы к https://СЕРВЕР:8443/supplier/...
# уходят на https://api.absoluttrade.ru/... с IP сервера (он в белом списке).
# Доступ только с заголовком X-Proxy-Key (значение задаётся на сервере,
# CHANGE_ME заменяется командой sed; в git секрет не хранить).
# Установка: /etc/nginx/sites-available/supplier-proxy.conf + симлинк в sites-enabled.
server {
    listen 8443 ssl;
    server_name 89.169.138.130;

    ssl_certificate     /etc/nginx/certs/supplier.crt;
    ssl_certificate_key /etc/nginx/certs/supplier.key;

    location /supplier/ {
        if ($http_x_proxy_key != "CHANGE_ME") {
            return 403;
        }
        proxy_pass https://api.absoluttrade.ru/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.absoluttrade.ru;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    location / {
        return 404;
    }
}